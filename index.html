<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华夏时空 · 基于 Agent 的中国历史学习与研究平台（交互原型）</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8fafc; --border:#e5e7eb; --border-strong:#cbd5e1;
  --text:#0f172a; --text-2:#475569; --text-3:#94a3b8;
  --brand:#b91c1c; --brand-soft:#fef2f2;
  --gold:#a16207; --blue:#1d4ed8; --green:#15803d; --purple:#7e22ce; --teal:#0f766e; --slate:#475569;
  --r1:6px; --r2:10px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
.app{display:grid;grid-template-rows:56px 1fr;grid-template-columns:1fr 400px;grid-template-areas:"header header" "main side";gap:14px;padding:14px;min-height:100vh}
@media(max-width:1100px){.app{grid-template-columns:1fr;grid-template-areas:"header" "main" "side"}}

/* Header */
header{grid-area:header;display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:0 18px;box-shadow:var(--shadow)}
.logo{font-size:17px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.logo small{font-size:11px;font-weight:400;color:var(--text-3);margin-left:8px;letter-spacing:0}
.search{flex:1;max-width:380px;position:relative}
.search input{width:100%;height:34px;border:1px solid var(--border);border-radius:var(--r1);padding:0 12px 0 32px;font-size:13px;background:var(--surface-2);outline:none}
.search input:focus{border-color:var(--brand)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;color:var(--text-3)}
.suggest{position:absolute;top:38px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r1);box-shadow:0 8px 24px rgba(15,23,42,.12);z-index:50;max-height:280px;overflow:auto;display:none}
.suggest .sg-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--surface-2)}
.suggest .sg-item:hover{background:var(--surface-2)}
.suggest .sg-item b{color:var(--brand)}
.suggest .sg-type{font-size:11px;color:var(--text-3);margin-left:6px}
.audience{display:flex;border:1px solid var(--border);border-radius:var(--r1);overflow:hidden}
.audience button{border:0;background:var(--surface);padding:6px 12px;font-size:12.5px;cursor:pointer;color:var(--text-2)}
.audience button.on{background:var(--brand);color:#fff}
.hd-note{font-size:11.5px;color:var(--text-3);margin-left:auto;white-space:nowrap}

/* Main column */
main{grid-area:main;display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--shadow)}
.map-card{padding:14px 14px 6px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.card-title{font-size:14px;font-weight:600}
.card-title .tag{font-size:11px;font-weight:400;color:var(--text-3);margin-left:8px}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.chk{font-size:12px;color:var(--text-2);border:1px solid var(--border);border-radius:999px;padding:3px 10px;cursor:pointer;background:var(--surface-2);user-select:none}
.chk.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.map-wrap{width:100%;position:relative;background:linear-gradient(#fbfcfd,#f6f8fa);border-radius:var(--r1);border:1px solid var(--border)}
.map-wrap svg{display:block;width:100%;height:auto}
.terr{transition:opacity .35s ease}
.river{fill:none;stroke:#60a5fa;stroke-width:1.6;opacity:.55}
.city-dot{fill:#94a3b8}
.city-lbl{font-size:10px;fill:#94a3b8}
.ev-dot{cursor:pointer}
.ev-dot circle.core{fill:var(--brand);stroke:#fff;stroke-width:1.5}
.ev-dot circle.halo{fill:none;stroke:var(--brand);stroke-width:1.5;opacity:.5;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{r:5px;opacity:.5}100%{r:14px;opacity:0}}
.ev-lbl{font-size:10.5px;font-weight:600;fill:var(--brand);paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
.cap-mark{fill:var(--gold);stroke:#fff;stroke-width:1.2}
.cap-lbl{font-size:11px;font-weight:700;fill:var(--gold);paint-order:stroke;stroke:#fff;stroke-width:3px}
.nanhai{fill:none;stroke:var(--border-strong);stroke-width:1;stroke-dasharray:4 3}
.nh-dot{fill:var(--text-3)}
.nh-lbl{font-size:9px;fill:var(--text-3)}
.map-legend{display:flex;gap:14px;padding:8px 4px 4px;font-size:11.5px;color:var(--text-2);flex-wrap:wrap}
.map-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Timeline */
.tl-card{padding:12px 16px 14px}
.tl-now{font-size:13px;font-weight:600}
.tl-now .yr{color:var(--brand);font-size:16px;margin-right:8px}
.tl-now .meta{font-weight:400;color:var(--text-2);font-size:12.5px;margin-left:8px}
.lanes{position:relative;height:34px;margin:10px 0 4px}
.lane{position:absolute;height:18px;top:8px;border-radius:4px;display:flex;align-items:center;padding:0 6px;font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;cursor:pointer;opacity:.92}
.lane:hover{opacity:1;outline:2px solid rgba(185,28,28,.35)}
.lane.coex{height:8px;top:21px;opacity:.8;font-size:0}
.track{position:relative;height:26px;margin-top:6px;cursor:pointer}
.tl-line{position:absolute;top:12px;left:0;right:0;height:2px;background:var(--border-strong);border-radius:1px}
.tl-tick{position:absolute;top:8px;width:1px;height:10px;background:var(--border-strong)}
.tl-tick span{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-3);white-space:nowrap}
.tl-handle{position:absolute;top:4px;width:2px;height:18px;background:var(--brand);transform:translateX(-1px);z-index:5}
.tl-handle::after{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tl-hint{font-size:11px;color:var(--text-3);margin-top:12px}
.tl-hint b{color:var(--text-2)}

/* Event strip */
.ev-strip{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px}
.ev-chip{flex:0 0 auto;min-width:150px;max-width:190px;border:1px solid var(--border);border-radius:var(--r1);padding:8px 10px;cursor:pointer;background:var(--surface-2);transition:border-color .15s}
.ev-chip:hover{border-color:var(--brand)}
.ev-chip .y{font-size:11px;color:var(--brand);font-weight:600}
.ev-chip .n{font-size:12.5px;font-weight:600;margin:2px 0}
.ev-chip .p{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Side panel */
aside{grid-area:side;display:flex;flex-direction:column;min-height:0}
.panel{display:flex;flex-direction:column;flex:1;min-height:0}
.tabs{display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--border)}
.tabs button{border:0;background:none;padding:8px 9px;font-size:13px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.panel-body{padding:14px 16px;overflow-y:auto;flex:1}
.empty{color:var(--text-3);font-size:13px;text-align:center;padding:40px 10px}
.empty .big{font-size:30px;margin-bottom:10px}
.detail h2{font-size:18px;margin-bottom:2px}
.detail .sub{font-size:12px;color:var(--text-3);margin-bottom:10px}
.badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-right:6px}
.b-bc{background:#fef3c7;color:#92400e}
.b-ev{background:#fee2e2;color:#991b1b}
.b-pl{background:#dbeafe;color:#1e40af}
.kv{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:13px;margin:10px 0}
.kv dt{color:var(--text-3)}
.kv dd{color:var(--text-2)}
.narr{font-size:13.5px;line-height:1.8;background:var(--surface-2);border-left:3px solid var(--brand);padding:10px 12px;border-radius:0 6px 6px 0;margin:10px 0}
.narr .who{font-size:11px;color:var(--text-3);display:block;margin-bottom:4px}
.sec-t{font-size:12.5px;font-weight:600;margin:14px 0 6px;color:var(--text-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .c{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:2px 10px;cursor:pointer;background:var(--surface)}
.chips .c:hover{border-color:var(--brand);color:var(--brand)}
.dispute{background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:8px 10px;font-size:12px;color:#92400e;margin-top:10px}
.signif{font-size:12.5px;color:var(--text-2);margin-top:8px}
.signif b{color:var(--text)}

/* Sources */
.src{border:1px solid var(--border);border-radius:var(--r1);padding:10px 12px;margin-bottom:10px;background:var(--surface-2)}
.src-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lvl{font-size:10.5px;padding:1px 7px;border-radius:3px;font-weight:600}
.lvl-1{background:#fee2e2;color:#991b1b}
.lvl-2{background:#e0e7ff;color:#3730a3}
.lvl-3{background:#f1f5f9;color:#475569}
.src-work{font-size:12.5px;font-weight:600}
.src-text{font-size:13px;line-height:1.9;color:var(--text);font-family:"Songti SC","SimSun",serif}
.src-trans{font-size:12.5px;color:var(--text-2);margin-top:5px}
.conf{margin-top:7px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3)}
.conf-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.conf-bar i{display:block;height:100%;background:var(--green)}

/* KG */
.kg-wrap svg{width:100%;height:auto}
.kg-node{cursor:pointer}
.kg-node circle{stroke-width:2}
.kg-node text{font-size:11px;font-weight:600;fill:#fff;text-anchor:middle;dominant-baseline:central}
.kg-edge{stroke:var(--border-strong);stroke-width:1.2;fill:none}
.kg-edge-lbl{font-size:9.5px;fill:var(--text-3)}
.kg-legend{font-size:11.5px;color:var(--text-2);margin-top:8px}
.kg-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px}

/* Architecture tab */
.arch-layer{border:1px solid var(--border);border-radius:var(--r1);padding:10px 12px;margin-bottom:8px;background:var(--surface-2)}
.arch-layer h4{font-size:13px;margin-bottom:3px}
.arch-layer h4 span{font-size:10.5px;font-weight:400;color:#fff;padding:1px 7px;border-radius:3px;margin-left:6px;vertical-align:1px}
.arch-layer p{font-size:12px;color:var(--text-2)}
.arch-arrow{text-align:center;color:var(--text-3);font-size:14px;line-height:1;margin:2px 0}
.schema-box{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.schema-box .e{border:1px dashed var(--border-strong);border-radius:5px;padding:5px;text-align:center;font-size:11px;color:var(--text-2);background:var(--surface)}

/* 挂载书库 */
.book{border:1px solid var(--border);border-radius:var(--r1);padding:11px 12px;margin-bottom:10px;background:var(--surface-2)}
.book.mounted{border-color:#86efac;background:#f0fdf4}
.book-top{display:flex;gap:10px;align-items:flex-start}
.book-sp{flex:0 0 36px;width:36px;height:48px;border-radius:3px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.book-info{flex:1;min-width:0}
.book-info h4{font-size:13.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.book-info .au{font-size:11.5px;color:var(--text-3)}
.book-tags{margin:6px 0 2px}
.book-tags .t{font-size:10.5px;border:1px solid var(--border-strong);border-radius:999px;padding:0 8px;color:var(--text-2);margin-right:4px}
.book-desc{font-size:12px;color:var(--text-2);margin:6px 0 8px;line-height:1.7}
.book-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-size:12px;border-radius:var(--r1);padding:5px 14px;cursor:pointer;border:1px solid var(--brand);background:var(--brand);color:#fff;font-family:inherit}
.btn.ghost{background:var(--surface);color:var(--brand)}
.btn.gray{background:var(--surface);border-color:var(--border-strong);color:var(--text-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.steps{display:flex;gap:5px;margin:10px 0 6px}
.step{flex:1;border:1px solid var(--border);border-radius:6px;padding:6px 7px;font-size:10.5px;line-height:1.4;color:var(--text-3);background:var(--surface)}
.step .n{display:block;font-weight:700;margin-bottom:1px}
.step.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft);font-weight:600}
.step.done{color:var(--green);border-color:#86efac;background:#f0fdf4}
.step-note{font-size:11px;color:var(--text-3);margin:4px 0 8px}
.prop{border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px;display:flex;gap:8px;align-items:flex-start;background:var(--surface)}
.prop.low{border-color:#fde68a;background:#fffbeb}
.prop input{margin-top:3px}
.prop .pname{font-weight:600;font-size:12.5px}
.prop .pdesc{color:var(--text-2);font-size:11.5px;line-height:1.6}
.prop .pmeta{font-size:10.5px;color:var(--text-3);margin-top:2px}
.prop .pconf{font-size:11px;color:var(--text-3);white-space:nowrap;margin-top:1px}
.kind-ic{flex:0 0 22px;height:22px;border-radius:50%;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.mount-stats{font-size:11.5px;color:var(--green);margin:6px 0}

/* 时间轴挂载来源轨道 */
.mount-row{position:relative;height:10px;margin:3px 0 1px}
.mt-bar{position:absolute;height:5px;border-radius:3px;top:2px;cursor:pointer;opacity:.8}
.mt-bar:hover{opacity:1;height:8px;top:1px}
.mt-lbl{position:absolute;left:4px;top:2px;font-size:9px;color:#fff;white-space:nowrap;line-height:5px}
.mt-empty{font-size:10px;color:var(--text-3);line-height:10px}

/* 来源筛选 */
.src-flt{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.src-flt .lb{font-size:11px;color:var(--text-3)}
.src-flt .f{font-size:11px;border:1px solid var(--border);border-radius:999px;padding:1px 10px;cursor:pointer;background:var(--surface)}
.src-flt .f.on{border-color:var(--brand);color:#fff;background:var(--brand)}
.mbadge{font-size:9.5px;padding:0 5px;border-radius:3px;background:#dcfce7;color:#166534;font-weight:600}
.src-mtag{font-size:10px;padding:0 5px;border-radius:3px;margin-right:4px;font-weight:600}
.mt2{background:#e0e7ff;color:#3730a3}
.mt3{background:#f1f5f9;color:#475569}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">华夏时空 · ChronoSino<small>Agent 驱动的中国历史学习与研究平台 · 交互原型</small></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" placeholder="搜索人物 / 事件 / 地点，如：岳飞、安史之乱、长安…" autocomplete="off">
      <div class="suggest" id="suggest"></div>
    </div>
    <div class="audience" id="audience">
      <button data-a="student" class="on">学生</button>
      <button data-a="scholar">学者</button>
      <button data-a="fan">爱好者</button>
    </div>
    <div class="hd-note">原型数据为示意样本 · 正式版接入谭其骧地图集与古籍全文库</div>
  </header>

  <main>
    <section class="card map-card">
      <div class="card-head">
        <div class="card-title">历史地理视图<span class="tag">拖动下方时间轴，疆域与事件点随之变化</span></div>
        <div class="layers" id="layers">
          <span class="chk on" data-l="terr">朝代疆域</span>
          <span class="chk on" data-l="city">现代城市参照</span>
          <span class="chk on" data-l="river">水系</span>
          <span class="chk on" data-l="event">事件标记</span>
        </div>
      </div>
      <div class="map-wrap">
        <svg id="map" viewBox="0 0 700 408" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="map-legend">
        <span><i style="background:var(--brand)"></i>重大事件（可点击）</span>
        <span><i style="background:var(--gold)"></i>都城</span>
        <span><i style="background:#60a5fa;opacity:.6"></i>主要水系</span>
        <span><i style="background:#94a3b8"></i>现代城市参照点</span>
      </div>
    </section>

    <section class="card tl-card">
      <div class="tl-now"><span class="yr" id="nowYear"></span><span id="nowEmperor"></span><span class="meta" id="nowMeta"></span></div>
      <div class="lanes" id="lanes"></div>
      <div class="mount-row" id="mountRow"></div>
      <div class="track" id="track">
        <div class="tl-line"></div>
        <div id="ticks"></div>
        <div class="tl-handle" id="handle"></div>
      </div>
      <div class="tl-hint"><b>操作：</b>在轨道上点击 / 按住拖动切换年份；点击上方彩色朝代条可直接跳转；滚轮也可微调。</div>
    </section>

    <section class="card tl-card" style="padding-top:10px">
      <div class="card-head" style="margin-bottom:8px">
        <div class="card-title">本时期大事<span class="tag" id="stripTag"></span></div>
        <div class="src-flt" id="srcFilters"></div>
      </div>
      <div class="ev-strip" id="evStrip"></div>
    </section>
  </main>

  <aside>
    <section class="card panel">
      <div class="tabs" id="tabs">
        <button data-t="detail" class="on">实体详情</button>
        <button data-t="source">史料溯源</button>
        <button data-t="kg">关系图谱</button>
        <button data-t="books">挂载书库</button>
        <button data-t="arch">技术架构</button>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </section>
  </aside>
</div>

<script>
/* ================= 投影 ================= */
const W=700,H=394, LON0=72,LON1=136, LAT0=18,LAT1=54;
const X=lon=>(lon-LON0)/(LON1-LON0)*W;
const Y=lat=>(LAT1-lat)/(LAT1-LAT0)*H;
const pts=a=>a.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");

/* ================= 中国轮廓（简化示意） ================= */
const outline=[
[73.5,39.5],[75,40.6],[78,43],[80.4,44.2],[82.5,45.2],[85.7,48.4],[89,48.2],[91,46.8],
[95,49.2],[99,50.6],[103,51.2],[108,51.6],[113,50.2],[116.5,50.5],[119,52.6],[122,53.3],
[126,52.2],[130,49.5],[134.7,48.3],[133.5,45.5],[131.8,45],[130.6,42.6],[128,41.8],
[125.5,40.3],[123,39.6],[121.8,39.1],[121.2,38],[122.8,37.3],[121.2,36.2],[120.4,35],
[120.2,33.5],[121.6,31.3],[120.8,29],[120,27],[118,24.5],[115,22.8],[112.5,21.8],[110.2,21.2],
[108.6,21.5],[106.5,21.8],[103,22.5],[101.5,21.6],[100,21.5],[98.4,24],[97.6,27.6],[95,28],
[92,27.8],[89,28.2],[85.5,28.3],[82,29.5],[79.5,31.5],[77,34.5],[74.6,37.2],[73.5,39.5]];

/* ================= 水系 ================= */

 {lvl:1,work:"《史记·秦始皇本纪》",text:"二十六 年……秦初并天下，令丞相、御史曰：「……寡人以眇眇之身，兴兵诛暴乱，赖宗庙之灵，六王咸伏其辜，天下大定。今名号不更，無以称成功，传後世。其议帝号。」",trans:"公元前221年，秦兼并六国，秦王令群臣议定新名号，最终取「三皇五帝」之称，号曰「皇帝」。",conf:.97},

zhangqian:[
 {lvl:1,work:"《汉书·张骞李广利传》",text:"騫以郎應募，使月氏，與堂邑氏奴甘父俱出隴西……然騫鑿空，諸後使往者皆稱博望侯。",trans:"张骞应募出使大月氏，被扣匈奴十余年仍持汉节不失；《汉书》以「凿空」一词肯定其开通西域之功。",conf:.94},

 {lvl:1,work:"《三国志·吴书·周瑜传》",text:"權遂遣瑜及程普等與備并力逆曹公，遇於赤壁。時曹公軍眾已有疾病，初一交戰，公軍敗退，引次江北。",trans:"建安十三年（208），孙刘联军于赤壁破曹，火烧连营（火攻细节另见裴注引《江表传》）。",conf:.85},

 {lvl:1,work:"《晋书·苻坚载记》",text:"坚与苻融登城而望王师，见部阵齐整，将士精锐；又北望八公山上草木，皆类人形……",trans:"383年淝水之战，前秦苻坚「草木皆兵」，大败后溃兵「风声鹤唳」。东晋以少胜多，南北对峙格局延续。",conf:.9}],
dayunhe:[

xuanwumen:[

anlushan:[
 {lvl:1,work:"《资治通鉴·唐纪三十三》",text:"安祿山使副將何千年、高邈等將奚騎二十……甲子，祿山發所部兵及同羅、奚、契丹、室韋凡十五萬眾，號二十萬，反於范陽。",trans:"天宝十四载（755）十一月，安禄山以「讨杨国忠」为名在范阳起兵，安史之乱爆发。",conf:.94},

jingkang:[

{id:"daze",name:"陈胜吴广起义",year:-209,dyn:"qin",lon:117.1,lat:33.6,place:"大泽乡（今安徽宿州）",actors:["chenshe"],

 $("#nowEmperor").innerHTML=emp?`<span class="meta" style="margin-left:0">在位：${emp}</span>`:"";
}
function cnNum(n){
 if(n>40)return n;
 const d=["","一","二","三","四","五","六","七","八","九"];
 if(n<10)return d[n];
 if(n===10)return"十";
 if(n<20)return"十"+d[n-10];
 const t=Math.floor(n/10),o=n%10;
 return d[t]+"十"+(o?d[o]:"");
}
function setYear(y){
 year=Math.max(Y0_,Math.min(Y1_,Math.round(y)));
 renderHandle();renderMap();renderStrip();
 if(tab!=="arch") renderPanel();
}

/* ================= 拖动 ================= */
function bindTrack(){
 const tr=$("#track");let dragging=false;
 function pos(e){const r=tr.getBoundingClientRect();const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  return Y0_+Math.max(0,Math.min(1,cx/r.width))*(Y1_-Y0_)}
 tr.addEventListener("pointerdown",e=>{dragging=true;tr.setPointerCapture(e.pointerId);setYear(pos(e))});
 tr.addEventListener("pointermove",e=>{if(dragging)setYear(pos(e))});
 tr.addEventListener("pointerup",()=>dragging=false);
 tr.addEventListener("pointercancel",()=>dragging=false);
 window.addEventListener("wheel",e=>{if(e.target.closest(".track")){setYear(year+(e.deltaY<0?5:-5))}},{passive:true});
}

function kgHTML(e){

 });

 });
 nodes.forEach(n=>{

 });

 });

}
function bookCard(b){
 const isM=mountedBooks.has(b.id);
 const lvlName=["","一级史料","二级·研究","三级·文学/科普"][b.lvl];
 let h=`<div class="book ${isM?'mounted':''}">
  <div class="book-top">
   <div class="book-sp" style="background:${b.color}">${b.title.slice(0,1)}</div>
   <div class="book-info">
    <h4>${b.title} <span class="src-mtag mt${b.lvl}">${lvlName}</span>${isM?'<span class="mbadge">已挂载</span>':''}</h4>
    <div class="au">${b.author} · ${b.year} · 覆盖 ${fmtYear(b.span[0])}—${fmtYear(b.span[1])}</div>
    <div class="book-tags">${b.tags.map(t=>`<span class="t">#${t}</span>`).join("")}</div>
    <div class="book-desc">${b.desc}</div>`;
 if(!b._ui){
  h+=`<div class="book-actions"><button class="btn" data-act="extract" data-bid="${b.id}">提炼并挂载</button></div>`;
 } else if(!b._ui.ready){
  const st=b._ui.step;
  h+=`<div class="steps">`+pipelineSteps.map((s,i)=>{
   const cls=i<st?"done":i===st?"on":"";
   const [t1,t2]=s.split("\n");
   return `<div class="step ${cls}"><span class="n">${i+1}. ${t1}</span>${t2}</div>`;
  }).join("")+`</div>`;
  const cur=pipelineSteps[Math.min(st,pipelineSteps.length-1)].split("\n")[0];
  h+=`<div class="step-note">Agent 工作中：${cur} …（正式版此处展示抽取日志与中间产物）　<button class="btn gray" data-act="cancel" data-bid="${b.id}">取消</button></div>`;
 } else if(!isM){
  const acc=b._ui.accepted,nc=acc.filter(Boolean).length;
  h+=b.extracts.map((x,i)=>{
   const kindName={person:"人物",event:"事件",link:"挂载"}[x.kind];
   const col={person:"var(--gold)",event:"var(--brand)",link:"var(--purple)"}[x.kind];
   const low=x.conf<.5;
   const meta=x.kind==="link"?`对齐到主干事件：${events.find(e=>e.id===x.targetId)?.name||""}`
       :x.kind==="person"?`新建实体（人物）· ${x.years}`
       :`新建实体（事件）· ${fmtYear(x.year)} · ${x.place}`;
   return `<div class="prop ${low?'low':''}">
    <input type="checkbox" data-act="toggle" data-bid="${b.id}" data-i="${i}" ${acc[i]?'checked':''}>
    <span class="kind-ic" style="background:${col}">${kindName.slice(0,1)}</span>
    <div style="flex:1;min-width:0"><div class="pname">${x.name}</div><div class="pdesc">${x.summary}</div>
    <div class="pmeta">${meta}${low?' · 低置信度，建议人工核对上游史料':''}</div></div>
    <span class="pconf">${(x.conf*100).toFixed(0)}%</span></div>`;
  }).join("");
  h+=`<div class="book-actions" style="margin-top:8px"><button class="btn" data-act="mount" data-bid="${b.id}" id="mountBtn">确认挂载（${nc} 项）</button><button class="btn gray" data-act="discard" data-bid="${b.id}">放弃提案</button></div>`;
 } else {
  const np=b.extracts.filter(x=>x.kind==="person").length;
  const ne=b.extracts.filter(x=>x.kind==="event").length;
  const nl=b.extracts.filter(x=>x.kind==="link").length;
  h+=`<div class="mount-stats">✓ 已写入本体：${np} 个人物 · ${ne} 个事件 · ${nl} 个观点挂载点；即刻可搜索 / 过滤 / 溯源</div>
  <div class="book-actions"><button class="btn ghost" data-act="view" data-bid="${b.id}">前往该书年代查看</button>
  <button class="btn gray" data-act="unmount" data-bid="${b.id}">卸载</button></div>`;
 }
 h+=`</div></div>`;
 return h;
}

/* 启动提炼流水线（模拟 Agent 五步处理，正式版为异步真实任务流） */
function startExtract(bid){
 const b=findBook(bid);
 if(b._timer)clearInterval(b._timer);
 b._ui={step:0};
 renderPanel();
 b._timer=setInterval(()=>{
  b._ui.step++;
  if(b._ui.step>=pipelineSteps.length){
   clearInterval(b._timer);b._timer=null;
   b._ui.ready=true;
   b._ui.accepted=b.extracts.map(x=>x.conf>=.4);
  }
  renderPanel();
 },520);
}
function makeSrc(b,x){return {lvl:b.lvl,work:"《"+b.title+"》",text:x.summary,trans:x.summary,conf:x.conf,_bid:b.id}}

/* 确认挂载：将提案写入本体（Action Type 的写操作） */
function doMount(bid){
 const b=findBook(bid),acc=b._ui.accepted;
 b.extracts.forEach((x,i)=>{
  if(!acc[i])return;
  const src=makeSrc(b,x);
  if(x.kind==="person"){
   people.push({id:x.newId,name:x.name,years:x.years.split("—"),dynasty:b.dyn,
    home:"（挂载书源实体）",
    s:{student:x.summary,
       scholar:x.summary+"　【本体注记】本实体由《"+b.title+"》挂载，学术使用请核对原书及更上游史料。",
       fan:x.summary},
    _fromBook:bid,_bookSources:[src]});
  } else if(x.kind==="event"){
   events.push({id:x.newId,name:x.name,year:x.year,dyn:b.dyn,lon:x.lon,lat:x.lat,place:x.place,
    actors:[],
    s:{student:x.summary,scholar:x.summary,fan:x.summary},
    significance:null,
    dispute:"挂载观点：代表《"+b.title+"》作者的解释框架，非学界定论。",
    _fromBook:bid,_bookSources:[src]});
  } else if(x.kind==="link"){
   const t=getEntity("event",x.targetId);
   if(t){t._bookSources=t._bookSources||[];t._bookSources.push(src)}
  }
 });
 mountedBooks.add(bid);
 refreshAll();
}

/* 卸载：从本体移除该书写入的全部实体与挂载边 */
function doUnmount(bid){
 const b=findBook(bid);
 clearInterval(b._timer);b._timer=null;b._ui=null;
 for(let i=people.length-1;i>=0;i--)if(people[i]._fromBook===bid)people.splice(i,1);
 for(let i=events.length-1;i>=0;i--)if(events[i]._fromBook===bid)events.splice(i,1);
 [events,people,places].forEach(arr=>arr.forEach(e=>{
  if(e._bookSources)e._bookSources=e._bookSources.filter(s=>s._bid!==bid);
 }));
 mountedBooks.delete(bid);
 if(sourceFilter===bid)sourceFilter="all";
 refreshAll();
}
function renderMountRow(){
 const list=books.filter(b=>mountedBooks.has(b.id));
 if(!list.length){$("#mountRow").innerHTML=`<div class="mt-empty">挂载书源轨道：暂无（在右侧「挂载书库」提炼一本书即可见）</div>`;return}
 $("#mountRow").innerHTML=list.map(b=>{
  const l=yearToPct(b.span[0]),w=Math.max(yearToPct(b.span[1])-l,1.5);
  return `<div class="mt-bar" style="left:${l}%;width:${w}%;background:${b.color}" data-mt="${b.id}" title="《${b.title}》覆盖区间，点击跳转">
   ${w>9?`<span class="mt-lbl">《${b.title}》</span>`:""}</div>`;
 }).join("");
}
function refreshAll(){
 renderMountRow();renderMap();renderStrip();
 if(tab==="books"||tab==="source"||tab==="kg")renderPanel();
}
/* 面板内按钮事件委托（只绑定一次） */
function bindPanelActions(){
 const body=$("#panelBody");
 body.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act,bid=el.dataset.bid,b=findBook(bid);
  if(act==="extract")startExtract(bid);
  if(act==="cancel"||act==="discard"){clearInterval(b._timer);b._timer=null;b._ui=null;renderPanel()}
  if(act==="mount")doMount(bid);
  if(act==="unmount")doUnmount(bid);
  if(act==="view"){sourceFilter=bid;setYear(Math.round((b.span[0]+b.span[1])/2))}
 });
 body.addEventListener("change",ev=>{
  const el=ev.target.closest('input[data-act="toggle"]');if(!el)return;
  const b=findBook(el.dataset.bid);b._ui.accepted[el.dataset.i]=el.checked;
  const n=b._ui.accepted.filter(Boolean).length;
  const btn=body.querySelector("#mountBtn");if(btn)btn.textContent=`确认挂载（${n} 项）`;
 });
}
/* 时间轴书源轨道 + 大事条来源筛选的全局委托 */
function bindGlobalFilters(){
 document.addEventListener("click",ev=>{
  const mt=ev.target.closest("#mountRow .mt-bar");
  if(mt){const b=findBook(mt.dataset.mt);sourceFilter=b.id;setYear(Math.round((b.span[0]+b.span[1])/2));return}
  const f=ev.target.closest("#srcFilters .f");
  if(f){sourceFilter=f.dataset.src;renderMap();renderStrip()}
 });
}

function archHTML(){
 return `
 <div class="arch-layer"><h4>① 本体论 Ontology <span style="background:var(--purple)">Schema 层</span></h4>
 <p>定义实体类型与允许的关系：</p>
 <div class="schema-box">
  <div class="e">政权 Era<br><small>起止/疆域/都城</small></div>
  <div class="e">事件 Event<br><small>时/地/人/因果</small></div>
  <div class="e">人物 Person<br><small>生卒/职官/师承</small></div>
  <div class="e">地点 Place<br><small>古今名/沿革</small></div>
  <div class="e">制度 Institution<br><small>始创/沿革</small></div>
  <div class="e">文化 Culture<br><small>思想/艺术/科技</small></div>
 </div>
 <p style="margin-top:6px">关系：参与 / 发生于 / 触发 / 任职 / 师承 / 设治 / 创制</p></div>
 <div class="arch-arrow">▼ 按 Schema 落数据</div>
 <div class="arch-layer"><h4>② 知识图谱 KG <span style="background:var(--gold)">结构化事实层</span></h4>
 <p>人-事-地-制构成 Labeled Property Graph。<b>生产：Neo4j</b>（Cypher 做多跳关系推理）；本原型用 JSON + edges 数组模拟，右侧「关系图谱」页即其视图。另可用 RDF/OWL 对接国际数字人文（LOD）。</p></div>
 <div class="arch-arrow">▼ 回答时并行检索</div>
 <div class="arch-layer"><h4>③ RAG 史料检索 <span style="background:var(--blue)">原文证据层</span></h4>
 <p>《史记》《汉书》《资治通鉴》等全文切块向量化（pgvector / Milvus），配合 BM25 关键词混合检索。KG 给事实骨架，RAG 给原文出处；考据 Agent 交叉校验置信度，审阅 Agent 拦截无出处陈述。</p></div>
 <div class="arch-arrow">▼ 任何新书均可回流写入</div>
 <div class="arch-layer"><h4>④ 动态本体挂载（对标 Palantir Foundry）<span style="background:var(--purple)">写操作闭环</span></h4>
 <p>Foundry 的关键不是图本身，而是 <b>Ontology as operational layer</b>：Object Types / Link Types / Action Types。本系统映射——新书接入：Docling/Unstructured 解析 → Agent 抽取 → 时空归一化 → 实体对齐(ER) → 以「挂载提案（Action）」经人工审核写入本体 → 时间轴/地图/图谱实时联动；每个事实保留<b>数据血缘</b>（事实→书→章节→原文）。开源栈：Neo4j + pgvector + LangGraph + OpenMetadata。</p></div>
 <div class="arch-layer" style="background:#f0fdf4"><h4 style="color:var(--green)">结论</h4>
 <p><b>三者都要：</b>本体是地图（schema），KG 是骨架（事实与关系），RAG 是血肉（史料原文）。MVP 阶段本体可轻量、KG 可先用关系库/JSON，但<b>史料溯源（RAG + 引用）从第一天就必须做</b>，这是历史类产品与通用聊天机器人的根本区别。</p></div>`;
}

/* ================= 搜索 ================= */
function bindSearch(){
 const inp=$("#searchInput"),sg=$("#suggest");
 function q(term){
  const r=[];
  people.forEach(p=>{if(p.name.includes(term))r.push({type:"person",id:p.id,name:p.name,t:"人物"})});
  events.forEach(e=>{if(e.name.includes(term))r.push({type:"event",id:e.id,name:e.name,t:"事件"})});
  places.forEach(p=>{if(p.name.includes(term)||p.ancient.includes(term))r.push({type:"place",id:p.id,name:p.name,t:"地点"})});
  return r.slice(0,8);
 }
 inp.addEventListener("input",()=>{
  const v=inp.value.trim();
  if(!v){sg.style.display="none";return}
  const r=q(v);
  sg.innerHTML=r.length?r.map(x=>`<div class="sg-item" data-t="${x.type}" data-id="${x.id}">${x.name.replace(v,"<b>"+v+"</b>")}<span class="sg-type">${x.t}</span></div>`).join(""):`<div class="sg-item">无匹配（原型示例库约40个实体）</div>`;
  sg.style.display="block";
  sg.querySelectorAll(".sg-item[data-id]").forEach(el=>el.addEventListener("click",()=>{
   selected={type:el.dataset.t,id:el.dataset.id};sg.style.display="none";inp.value="";
   tab="detail";renderTabs();renderPanel();
  }));
 });
 document.addEventListener("click",e=>{if(!e.target.closest(".search"))sg.style.display="none"});
}

/* ================= 事件绑定 ================= */
$("#audience").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
 audience=b.dataset.a;
 $("#audience").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
 renderPanel();
}));
$("#tabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
 tab=b.dataset.t;renderTabs();renderPanel();
}));
$("#layers").querySelectorAll(".chk").forEach(c=>c.addEventListener("click",()=>{
 layerState[c.dataset.l]=!layerState[c.dataset.l];
 c.classList.toggle("on");renderMap();
}));

/* ================= 启动 ================= */
bindPanelActions();bindGlobalFilters();
renderLanes();renderMountRow();renderHandle();renderMap();bindTrack();renderStrip();bindSearch();renderPanel();
</script>
